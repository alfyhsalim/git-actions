name: Calculator-POC

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - ONPREM
          - AWS
          - BOTH

env:
  XRAY_PROJECT_KEY: XSP

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # Build and test inside Maven container
      # ------------------------------------------------------------------
      - name: Build and test inside Maven container
        run: |
          docker build --target build \
            -t calculator-build .
          rm -rf target && mkdir -p target
          container=$(docker create calculator-build)
          docker cp ${container}:/src/target ./target
          docker rm ${container}

      # ------------------------------------------------------------------
      # Build runtime Docker image
      # ------------------------------------------------------------------
      - name: Build runtime Docker Image
        run: |
          docker build --target runtime \
            -t calculator:${{ github.sha }} .

      # ------------------------------------------------------------------
      # Get Xray Token
      # ------------------------------------------------------------------
      - name: Authenticate to Xray
        id: xray-auth
        run: |
          TOKEN=$(curl -s \
            -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -H "Content-Type: application/json" \
            -d '{
              "client_id":"${{ secrets.XRAY_CLIENT_ID }}",
              "client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"
            }' | tr -d '"')

          echo "XRAY_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "XRAY_EXEC_KEY=${GITHUB_REPOSITORY}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Upload Junit Results to Xray
      # ------------------------------------------------------------------
      - name: Upload Test Results to Xray
        run: |

          for report in target/surefire-reports/*.xml
          do
            [ -f "$report" ] || continue

            curl --fail -X POST \
            -H "Authorization: Bearer $XRAY_TOKEN" \
            -H "Content-Type: text/xml" \
            --data-binary @"$report" \
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${XRAY_PROJECT_KEY}&testExecKey=${XRAY_EXEC_KEY}"
          done

      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -DskipTests \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t calculator:${{ github.sha }} .

      - name: Login to Docker Registry
        if: ${{ secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v5
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and Push Docker Image (to Nexus / Registry)
        if: ${{ secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          REG=${{ secrets.DOCKER_REGISTRY }}
          IMAGE=${REG}/${{ github.repository }}:${{ github.sha }}
          docker tag calculator:${{ github.sha }} ${IMAGE}
          docker push ${IMAGE}

      # ------------------------------------------------------------------
      # Publish Test Results
      # ------------------------------------------------------------------
      - name: Upload Surefire Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # ------------------------------------------------------------------
      # Publish JaCoCo Report
      # ------------------------------------------------------------------
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar