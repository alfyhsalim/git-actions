name: Calculator-POC

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - ONPREM
          - AWS
          - BOTH

env:
  XRAY_PROJECT_KEY: XSP

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # Build and test inside Maven container
      # ------------------------------------------------------------------
      - name: Build and test inside Maven container
        run: |
          docker build --target build \
            -t calculator-build .
          rm -rf target
          container=$(docker create calculator-build)
          docker cp ${container}:/src/target .
          docker rm ${container}

      # ------------------------------------------------------------------
      # Build runtime Docker image
      # ------------------------------------------------------------------
      - name: Build runtime Docker Image
        run: |
          docker build --target runtime \
            -t calculator:${{ github.sha }} .

      - name: Debug Target Folder
        run: |
          echo "Current Workspace"
          pwd
          echo "Target Contents"
          ls -R target || true

      # ------------------------------------------------------------------
      # Get Xray Token
      # ------------------------------------------------------------------
      - name: Authenticate to Xray
        id: xray-auth
        run: |
          TOKEN=$(curl -s \
            -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -H "Content-Type: application/json" \
            -d '{
              "client_id":"${{ secrets.XRAY_CLIENT_ID }}",
              "client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"
            }' | tr -d '"')

          echo "XRAY_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "PROJECT_NAME=Calculator-POC" >> $GITHUB_ENV
          echo "BUILD_NAME=Calculator-POC-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "REVISION=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> $GITHUB_ENV
          

      # ------------------------------------------------------------------
      # Upload Junit Results to Xray
      # ------------------------------------------------------------------
      - name: Upload Test Results to Xray
        run: |

          for report in target/surefire-reports/*.xml
          do
            [ -f "$report" ] || continue

            curl --fail -X POST \
            -H "Authorization: Bearer $XRAY_TOKEN" \
            -H "Content-Type: text/xml" \
            --data-binary @"$report" \
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${XRAY_PROJECT_KEY}&revision=${REVISION}&comment=${BUILD_NAME}"
          done 

      - name: Verify Image
        run: |
          docker images

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and Push Docker Image (to Nexus / Registry)
        env:
          IMAGE_NAME: ash0482/github-poc
        run: |
          REG=${{ secrets.DOCKER_REGISTRY }}
          IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag calculator:${{ github.sha }} ${IMAGE}
          docker push ${IMAGE}


      # ------------------------------------------------------------------
      # Deploy Container
      # ------------------------------------------------------------------
      - name: Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
            IMAGE=${{ secrets.DOCKER_REGISTRY }}/ash0482/github-poc:${{ github.sha }}
        run: |
          echo "Deploying Docker Image: ${IMAGE}"
          docker pull ${IMAGE}

          echo "Stopping existing container..."
          docker stop calculator || true
          echo "Removing existing container..."
          docker rm calculator || true

          echo "Running new container..."
          docker run -d \
              --name calculator \
              --restart always \
              -p 8080:8080 \
              ${IMAGE}

      - name: Verify Container
        run: |
          docker ps
    
      # ------------------------------------------------------------------
      # Health Check
      # ------------------------------------------------------------------
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        run: |
          sleep 10

          curl -f http://localhost:8080/
      
      - name: View Logs
        run: |
          docker logs calculator

      # ------------------------------------------------------------------
      # Publish Test Results
      # ------------------------------------------------------------------
      - name: Upload Surefire Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # ------------------------------------------------------------------
      # Publish JaCoCo Report
      # ------------------------------------------------------------------
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
